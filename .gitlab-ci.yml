

image: python:3.10

stages:
  - validate
  - test
  - security
  - build
  - container_scan

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: python-dependencies
  paths:
    - .cache/pip/

before_script:
  - python -m pip install -r requirements.txt

validate:
  stage: validate
  tags:
    - gitlab--duo
  script:
    - python -m compileall -q app.py tests/

unit_testing:
  stage: test
  tags:
    - gitlab--duo
  script:
    - python -m pytest -v --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
    paths:
      - report.xml


bandit_scan:
  stage: security
  tags:
    - gitlab--duo
  script:
    - pip install bandit
    - bandit -r app.py -f json -o bandit-report.json
  artifacts:
    when: always
    paths:
      - bandit-report.json

dependency_scan:
  stage: security
  tags:
    - gitlab--duo
  script:
    - pip install pip-audit
    - pip-audit -r requirements.txt

secret_scan:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  tags:
    - gitlab--duo
  before_script: []
  script:
    - gitleaks detect --source . --no-git --redact --exit-code 1



docker_build:
  stage: build

  image:
    name: quay.io/buildah/stable
    entrypoint: [""]

  tags:
    - gitlab--duo

  before_script: []

  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_FORMAT: docker

  script:
    - buildah --version
    - echo "$CI_REGISTRY_PASSWORD" | buildah login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - buildah bud --storage-driver=vfs -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - buildah images
    - buildah push --storage-driver=vfs "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"


trivy_scan:
  stage: container_scan

  image:
    name: aquasec/trivy:latest
    entrypoint: [""]

  tags:
    - gitlab--duo

  before_script: []

  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    TRIVY_AUTH_URL: "$CI_REGISTRY"
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivycache"

  cache:
    key: trivy-cache
    paths:
      - .trivycache/

  script:
    - trivy --version
    - echo "Scanning image $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA for HIGH and CRITICAL vulnerabilities..."
    - trivy image --exit-code 0 --severity HIGH,CRITICAL --format table "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - trivy image --exit-code 0 --severity HIGH,CRITICAL --format json --output trivy-report.json "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

  artifacts:
    when: always
    paths:
      - trivy-report.json
    expire_in: 1 week


